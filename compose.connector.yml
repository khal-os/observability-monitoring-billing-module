# THE CONNECTOR — the client's own LangWatch stack, its trace ingestor
# (the trace-ingestion-worker), plus the couplings it introduces on the
# module (env fragment on api). See compose.module.yml for how the role
# files assemble into one project (decision 65). The worker lives HERE,
# not in the module: it exists to drain THIS connector's ClickHouse, so
# its horizontal-scaling granularity is the LangWatch stack's — another
# LangWatch instance means another ingestor, and removing this file
# removes both (the module still composes; `make sync` over fixtures
# remains the offline-demo path). The file is named for the ROLE, not
# the vendor: a different connector in the future = a different
# compose.connector.yml filling the same slot in the chain, with its
# own ingestor + coupling fragments.
#
# LangWatch services mirror the OFFICIAL upstream compose.yml (ClickHouse
# stack — no OpenSearch), with two deliberate deviations: (1) app image
# pinned to a versioned tag instead of `latest` + pull_policy always;
# (2) postgres/clickhouse host publications removed. The separate `workers`
# container is kept as upstream ships it: START_WORKERS=true does NOT work
# on the production image (its start.sh needs `concurrently`, a dev-only
# dependency — verified absent in langwatch/langwatch:3.5.0).
#
# HORIZONTAL SCALING (decision 78): LangWatch's scaling unit is the
# stateless compute (app + workers) over ONE postgres + ONE redis + ONE
# clickhouse — the stateful spine stays single per client. Here that means:
# `langwatch-workers` scales via LANGWATCH_WORKERS_REPLICAS (they
# coordinate through the redis queue; no port, no name, no state); the
# `langwatch` app stays at 1 replica because it owns the host-port
# binding — scaling it needs a fan-in proxy in front (not built until
# needed). The backing stores get env-tunable memory limits instead,
# because N replicas multiply load on the same three stores. The
# trace-ingestion-worker must NEVER scale past 1 per source — see its
# comment. Scaling beyond one host = drop this role file and point
# LANGWATCH_CLICKHOUSE_URL at the external stack (decision 65).

x-langwatch-env: &langwatch-env
  SKIP_ENV_VALIDATION: "true"
  NODE_ENV: production
  INSTALL_METHOD: docker
  DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
  CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
  REDIS_URL: redis://redis:6379
  LANGWATCH_ENDPOINT: http://langwatch:5560 # in-project callbacks (workers -> app)
  # These three must all equal the browser-visible URL of THIS instance,
  # or CLI/session auth fails with "Unauthorized: Invalid credentials".
  BASE_HOST: http://localhost:${LANGWATCH_PORT:-5560}
  NEXTAUTH_URL: http://localhost:${LANGWATCH_PORT:-5560}
  LANGWATCH_API_URL: http://localhost:${LANGWATCH_PORT:-5560}
  NEXTAUTH_PROVIDER: email # plain email+password signup, no verification step
  # `:?` — fail at compose time, not at runtime: LangWatch sets
  # SKIP_ENV_VALIDATION and will happily boot with EMPTY secrets (forgeable
  # session tokens; with >1 replica, sessions that validate on one replica
  # and bounce on another). And CREDENTIALS_SECRET set late is unrecoverable
  # (stored credentials become undecryptable), so empty-then-fix is the
  # worst path — refuse it loudly here.
  NEXTAUTH_SECRET: ${LW_NEXTAUTH_SECRET:?generate with `openssl rand -base64 32` (clients/<name>.env)}
  API_TOKEN_JWT_SECRET: ${LW_API_TOKEN_JWT_SECRET:?generate with `openssl rand -base64 32` (clients/<name>.env)}
  CREDENTIALS_SECRET: ${LW_CREDENTIALS_SECRET:?generate with `openssl rand -base64 32` (clients/<name>.env) — must never change after first boot}

x-langwatch-deps: &langwatch-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  # ---- couplings onto the module (merged into compose.module.yml) ----

  api:
    environment:
      # Internal DNS — server-to-server sync never leaves the project network.
      # While LANGWATCH_API_KEY is empty (pre-onboarding), the sync factory
      # falls back to the fixture-backed fake client.
      LANGWATCH_ENDPOINT: ${LANGWATCH_API_KEY:+http://langwatch:5560}
      LANGWATCH_API_KEY: ${LANGWATCH_API_KEY:-}
      # Manual `make sync` runs in the api service — give it the same direct-
      # ClickHouse source the trace-ingestion-worker uses (decision 59), so backfills
      # skip the ~100-trace search cap. Same onboarding gate as above.
      LANGWATCH_CLICKHOUSE_URL: ${LANGWATCH_API_KEY:+http://clickhouse:8123}
      LANGWATCH_CLICKHOUSE_USER: default
      LANGWATCH_CLICKHOUSE_PASSWORD: langwatch
      LANGWATCH_CLICKHOUSE_DATABASE: langwatch
      LANGWATCH_PROJECT_ID: ${LANGWATCH_PROJECT_ID:-}

  # ---- the connector's ingestor (module image, connector lifecycle) ----

  # Continuous ingestion (T2): the watermark loop in a sidecar — same image
  # as the api, different command. Reads this connector's OWN ClickHouse
  # (decision 59) and writes to the client's mongo. Gated by onboarding:
  # while LANGWATCH_API_KEY is empty the ClickHouse URL interpolates to
  # empty and the worker idles.
  #
  # No depends_on for mongo here — this file must not name a service
  # another optional role file provides (an external database drops
  # compose.mongodb.yml from the chain, and compose errors on a dependency
  # to an undefined service). Boot ordering is covered anyway: the mongo
  # driver waits up to 30s of server selection on connect, and
  # `restart: unless-stopped` retries the pathological case.
  # EXACTLY ONE replica per source — never scale this service. The sync
  # watermark (sync_state) has no lease: two drainers race on the cursor
  # (last-writer-wins can move it BACKWARDS pre-guard, and even with the
  # never-backwards guard two instances double-read every batch and churn
  # attribution). The fixed container_name is a deliberate second lock:
  # `--scale trace-ingestion-worker=2` fails on the name collision instead
  # of silently double-draining. LangWatch replicas are irrelevant here —
  # this worker reads ClickHouse, not the app.
  trace-ingestion-worker:
    image: ${API_IMAGE:-platform-api:local}
    container_name: ${CLIENT_NAME}-trace-ingestion-worker
    command: ["node", "dist/main/jobs/run-trace-ingestion-loop.js"]
    init: true # forward SIGTERM to node (the loop finishes its batch first)
    # One batch must be able to finish before SIGKILL — default 10s is
    # tight for a 1000-trace batch on a busy host.
    stop_grace_period: 60s
    environment:
      ENVIRONMENT: production
      SERVER_PORT: "3000" # unused (no server) but required by config validation
      CLIENT_NAME: ${CLIENT_NAME}
      MONGO_DB_HOST: ${MONGO_DB_HOST:-mongo}
      MONGO_DB_PORT: ${MONGO_DB_PORT:-27017}
      MONGO_DB_NAME: ${CLIENT_NAME}
      MONGO_DB_USER: ${MONGO_DB_USER:-}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      TRACE_INGESTION_INTERVAL_SECONDS: ${TRACE_INGESTION_INTERVAL_SECONDS:-60}
      TRACE_INGESTION_BATCH_SIZE: ${TRACE_INGESTION_BATCH_SIZE:-1000}
      TRACE_INGESTION_QUIET_PERIOD_SECONDS: ${TRACE_INGESTION_QUIET_PERIOD_SECONDS:-900}
      REPROCESS_INTERVAL_SECONDS: ${REPROCESS_INTERVAL_SECONDS:-3600}
      LANGWATCH_CLICKHOUSE_URL: ${LANGWATCH_API_KEY:+http://clickhouse:8123}
      LANGWATCH_CLICKHOUSE_USER: default
      LANGWATCH_CLICKHOUSE_PASSWORD: langwatch
      LANGWATCH_CLICKHOUSE_DATABASE: langwatch
      # Optional row filter (LangWatch project id) — see clients/example.env.
      LANGWATCH_PROJECT_ID: ${LANGWATCH_PROJECT_ID:-}
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      # No port to probe (loop, not server) — process-level check: the loop
      # is a node process; gone means wedged/crashed, not idling.
      test: ["CMD-SHELL", "pgrep node > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # ---- the LangWatch stack itself ----

  # Single replica by construction: it owns the host-port binding. Scaling
  # the app requires a fan-in proxy publishing the port instead — add that
  # when the app (not the workers) is actually the bottleneck.
  langwatch:
    image: langwatch/langwatch:3.5.0
    container_name: ${CLIENT_NAME}-langwatch
    environment:
      <<: *langwatch-env
    ports:
      # Loopback by default: NEXTAUTH_PROVIDER=email means open signup, so
      # a LAN-reachable LangWatch lets outsiders self-register. Exposing it
      # is an explicit opt-in — LANGWATCH_BIND=0.0.0.0 + a firewall
      # (see clients/example.env).
      - "${LANGWATCH_BIND:-127.0.0.1}:${LANGWATCH_PORT:-5560}:5560"
    depends_on:
      <<: *langwatch-deps
    healthcheck:
      # The app answers on / once Next.js is up (redirects included — wget
      # follows them locally). start_period is generous: first boot runs
      # prisma migrations before the server listens.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5560/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${LANGWATCH_MEMORY_LIMIT:-2g}

  # The horizontal-scaling unit: stateless queue consumers coordinated by
  # redis. No container_name — a fixed name caps replicas at 1 (two
  # containers cannot share one name); compose names these
  # <project>-langwatch-workers-1..N.
  langwatch-workers:
    image: langwatch/langwatch:3.5.0
    command: ["pnpm", "run", "start:workers"]
    working_dir: /app/langwatch
    environment:
      <<: *langwatch-env
    depends_on:
      <<: *langwatch-deps
    healthcheck:
      # No port to probe — process-level check: the queue consumers are node
      # processes; none left alive means the container is wedged, not working.
      test: ["CMD-SHELL", "pgrep node > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      replicas: ${LANGWATCH_WORKERS_REPLICAS:-1}
      resources:
        limits:
          memory: ${LANGWATCH_WORKERS_MEMORY_LIMIT:-1536m} # upstream dev compose cap, per replica

  postgres:
    image: postgres:16
    container_name: ${CLIENT_NAME}-langwatch-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Defaults sized for 1 app + 1 worker; raise via the client env
          # when LANGWATCH_WORKERS_REPLICAS > 1 (N replicas multiply
          # connections and write volume into this single store).
          memory: ${LW_POSTGRES_MEMORY_LIMIT:-256m}

  redis:
    image: redis:7-alpine
    container_name: ${CLIENT_NAME}-langwatch-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${LW_REDIS_MEMORY_LIMIT:-512m} # upstream raised this from 64m after BGSAVE OOM kills

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    container_name: ${CLIENT_NAME}-langwatch-clickhouse
    environment:
      CLICKHOUSE_PASSWORD: langwatch
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${LW_CLICKHOUSE_MEMORY_LIMIT:-2g}
          cpus: ${LW_CLICKHOUSE_CPU_LIMIT:-1.0}

volumes:
  db-data:
  redis-data:
  clickhouse-data:
