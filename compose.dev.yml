# DEV-ONLY override — never part of a production deployment:
#
#   docker compose -f compose.module.yml -f compose.connector.yml -f compose.mongodb.yml -f compose.dev.yml --env-file clients/<name>.env up -d
#   (or: make up CLIENT=<name>)
#
# Adds build blocks so `... up --build` / `make build` can produce the
# images locally (production references prebuilt ${MODULE_IMAGE} /
# ${CONNECTOR_IMAGE} / ${UI_IMAGE}), and mounts the generated demo fixtures
# over the CONNECTOR image's fixture directory, so the fixture-backed fake
# sync (empty LANGWATCH_API_KEY) serves THIS client's demo traffic.
# Regenerate with packages/connector/scripts/generate-demo-fixtures.mjs.

services:
  api:
    build:
      context: .
      dockerfile: docker/module.Dockerfile

  trace-ingestion-worker:
    build:
      context: .
      dockerfile: docker/connector.Dockerfile
    volumes:
      - ./demo-data/${CLIENT_NAME}:/app/packages/connector/src/infrastructure/traceSource/fixtures:ro

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile

  # Dev-only mongo access for Compass/mongosh from the host, bound to
  # localhost. Set MONGO_HOST_PORT in the client env file for a stable port;
  # unset, Docker picks a free ephemeral one (see `docker port <client>-mongo`).
  mongo:
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-0}:27017"
