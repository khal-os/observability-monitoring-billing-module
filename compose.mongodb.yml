# THE DATABASE — the client's own MongoDB, plus the coupling it
# introduces on the module (dependency fragment on api). The
# trace-ingestion-worker (compose.connector.yml) also writes here but
# carries NO fragment in this file: it only exists when the connector
# file is in the chain, and a fragment on an undefined service breaks
# the module+database chain.
# See compose.module.yml for how the role files assemble into one project
# (decision 65). An EXTERNAL database (e.g. Atlas) = drop this file from
# the chain and set MONGO_DB_HOST/PORT/USER/PASSWORD in the client env —
# the module's defaults point at the in-project `mongo` host only when
# this file provides it. A different store in the future = a sibling
# compose.<db>.yml with its own coupling fragments.

services:
  # ---- coupling onto the module (merged into compose.module.yml) ----

  api:
    depends_on:
      mongo:
        condition: service_healthy

  # ---- the database itself ----

  mongo:
    image: mongo:7
    container_name: ${CLIENT_NAME}-mongo
    # audit G-4: the ONE container whose data cannot be re-fetched
    # (invariant 6 — the permanent archive). Docker's default 10s SIGKILL
    # can hit mongod mid-checkpoint on a large dirty cache (a 4g client),
    # forcing journal recovery and, on a replica set, a rollback of
    # unacknowledged writes. Give the checkpoint room.
    stop_grace_period: 120s
    # Empty values are treated as unset by the mongo entrypoint: with
    # credentials the server enforces auth, without them it is open — but
    # only inside the project network either way (no host port published;
    # use `docker exec -it <client>-mongo mongosh` for direct inserts).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:-}
    # SINGLE-NODE REPLICA SET (decision 81): the repositories use
    # multi-document transactions (trace + facet counter commit or abort
    # together), and mongod only allows transactions on a replica set.
    # Restarting an existing standalone volume with --replSet is the
    # supported upgrade path — data is preserved; the healthcheck below
    # initiates the set once. With auth enabled a replica set additionally
    # REQUIRES a keyFile (internal auth): generated into the volume on
    # first auth boot and reused from then on. Compass/mongosh from the
    # host (dev port) must append ?directConnection=true — the advertised
    # member host `mongo:27017` only resolves inside the project network.
    command: >
      bash -c '
        if [ -n "$$MONGO_INITDB_ROOT_USERNAME" ]; then
          if [ ! -f /data/db/replica.key ]; then
            openssl rand -base64 756 > /data/db/replica.key;
          fi;
          chown mongodb:mongodb /data/db/replica.key;
          chmod 400 /data/db/replica.key;
          exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/db/replica.key;
        else
          exec docker-entrypoint.sh mongod --replSet rs0;
        fi'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Authenticates when credentials are configured: a plain ping is
      # auth-exempt and would stay green even in the broken "credentials
      # added AFTER an auth-less first boot" state (entrypoint only creates
      # the root user on an empty volume). ${MONGO_DB_USER:+...} interpolates
      # at compose time; $$MONGO_INITDB_ROOT_* expand inside the container.
      # Also initiates the single-node replica set exactly once (member
      # host pinned to the SERVICE name so every container in the project
      # resolves it) and only reports healthy once this node is the
      # writable primary — transactions need a primary, not just a ping.
      test: ["CMD-SHELL", "mongosh --quiet ${MONGO_DB_USER:+-u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin} --eval \"try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }; if (!db.hello().isWritablePrimary) { quit(1) }; db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Sizing lever (decision 77 / QA15): mongo 7 is cgroup-aware and
          # auto-sizes its cache from this limit. At 1M traces (~3.4 GB)
          # the 512m default thrashes — size ≥ the working set (e.g. 4g).
          memory: ${MONGO_MEMORY_LIMIT:-512m}

volumes:
  mongo-data:
