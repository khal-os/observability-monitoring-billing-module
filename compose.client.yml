# THE single-tenant deployment unit: one client = one compose project,
# FULLY self-contained — api + its own mongo + its own LangWatch stack.
# Nothing shared between clients, nothing external required. Deploying N
# clients = applying this same file N times with N env files:
#
#   docker compose -f compose.client.yml --env-file <client>.env up -d
#
# (Dev adds -f compose.dev.yml for the build block + demo fixtures; the
# Makefile wraps both forms. See clients/example.env for the env contract.)
#
# This file knows NO client: every client-specific value arrives via the
# env file. ${CLIENT_NAME:?...} makes a missing env file fail loudly
# instead of composing a half-named stack.
#
# LangWatch services mirror the OFFICIAL upstream compose.yml (ClickHouse
# stack — no OpenSearch), with two deliberate deviations: (1) app image
# pinned to a versioned tag instead of `latest` + pull_policy always;
# (2) postgres/clickhouse host publications removed. The separate `workers`
# container is kept as upstream ships it: START_WORKERS=true does NOT work
# on the production image (its start.sh needs `concurrently`, a dev-only
# dependency — verified absent in langwatch/langwatch:3.5.0).

# Fallback project name = the client slug. Without this, an env file that
# forgets COMPOSE_PROJECT_NAME would fall back to the DIRECTORY name — and
# two such clients would silently collapse into one project sharing one
# mongo volume. COMPOSE_PROJECT_NAME from the env file still takes
# precedence when set.
name: ${CLIENT_NAME}

x-langwatch-env: &langwatch-env
  SKIP_ENV_VALIDATION: "true"
  NODE_ENV: production
  INSTALL_METHOD: docker
  DATABASE_URL: postgresql://prisma:prisma@postgres:5432/mydb?schema=mydb
  CLICKHOUSE_URL: http://default:langwatch@clickhouse:8123/langwatch
  REDIS_URL: redis://redis:6379
  LANGWATCH_ENDPOINT: http://langwatch:5560 # in-project callbacks (workers -> app)
  # These three must all equal the browser-visible URL of THIS instance,
  # or CLI/session auth fails with "Unauthorized: Invalid credentials".
  BASE_HOST: http://localhost:${LANGWATCH_PORT:-5560}
  NEXTAUTH_URL: http://localhost:${LANGWATCH_PORT:-5560}
  LANGWATCH_API_URL: http://localhost:${LANGWATCH_PORT:-5560}
  NEXTAUTH_PROVIDER: email # plain email+password signup, no verification step
  NEXTAUTH_SECRET: ${LW_NEXTAUTH_SECRET}
  API_TOKEN_JWT_SECRET: ${LW_API_TOKEN_JWT_SECRET}
  CREDENTIALS_SECRET: ${LW_CREDENTIALS_SECRET}

x-langwatch-deps: &langwatch-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  api:
    image: ${API_IMAGE:-platform-api:local}
    container_name: ${CLIENT_NAME:?set CLIENT_NAME via --env-file (see clients/example.env)}-api
    init: true # app has no signal handlers; let PID 1 forward SIGTERM
    environment:
      ENVIRONMENT: production
      SERVER_PORT: "3000"
      CLIENT_NAME: ${CLIENT_NAME} # brands the OpenAPI docs of this instance
      MONGO_DB_HOST: mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_NAME: ${CLIENT_NAME}
      # Optional mongo auth: set both in the env file and the in-stack mongo
      # boots with this root user; leave both empty for an auth-less dev DB.
      MONGO_DB_USER: ${MONGO_DB_USER:-}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      # Internal DNS — server-to-server sync never leaves the project network.
      # While LANGWATCH_API_KEY is empty (pre-onboarding), the sync factory
      # falls back to the fixture-backed fake client.
      LANGWATCH_ENDPOINT: ${LANGWATCH_API_KEY:+http://langwatch:5560}
      LANGWATCH_API_KEY: ${LANGWATCH_API_KEY:-}
      # Manual `make sync` runs in THIS service — give it the same direct-
      # ClickHouse source the sync-worker uses (decision 59), so backfills
      # skip the ~100-trace search cap. Same onboarding gate as above.
      LANGWATCH_CLICKHOUSE_URL: ${LANGWATCH_API_KEY:+http://clickhouse:8123}
      LANGWATCH_CLICKHOUSE_USER: default
      LANGWATCH_CLICKHOUSE_PASSWORD: langwatch
      LANGWATCH_CLICKHOUSE_DATABASE: langwatch
      LANGWATCH_PROJECT_ID: ${LANGWATCH_PROJECT_ID:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      # openapi.json is built in memory at startup — proves the process is up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/docs/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  # Continuous ingestion (T2): the watermark loop in a sidecar — same image
  # as the api, different command (the same pattern as langwatch-workers).
  # Reads LangWatch's OWN ClickHouse (decision 59) and writes to this
  # client's mongo. Gated like LANGWATCH_ENDPOINT: while LANGWATCH_API_KEY
  # is empty (pre-onboarding / offline demo), the URL interpolates to empty
  # and the worker idles — `make sync` over fixtures remains the demo path.
  sync-worker:
    image: ${API_IMAGE:-platform-api:local}
    container_name: ${CLIENT_NAME}-sync-worker
    command: ["node", "dist/main/jobs/run-sync-loop.js"]
    init: true # forward SIGTERM to node (the loop finishes its batch first)
    # One batch must be able to finish before SIGKILL — default 10s is
    # tight for a 1000-trace batch on a busy host.
    stop_grace_period: 60s
    environment:
      ENVIRONMENT: production
      SERVER_PORT: "3000" # unused (no server) but required by config validation
      CLIENT_NAME: ${CLIENT_NAME}
      MONGO_DB_HOST: mongo
      MONGO_DB_PORT: "27017"
      MONGO_DB_NAME: ${CLIENT_NAME}
      MONGO_DB_USER: ${MONGO_DB_USER:-}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      LANGWATCH_CLICKHOUSE_URL: ${LANGWATCH_API_KEY:+http://clickhouse:8123}
      LANGWATCH_CLICKHOUSE_USER: default
      LANGWATCH_CLICKHOUSE_PASSWORD: langwatch
      LANGWATCH_CLICKHOUSE_DATABASE: langwatch
      # Optional row filter (LangWatch project id) — see clients/example.env.
      LANGWATCH_PROJECT_ID: ${LANGWATCH_PROJECT_ID:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      SYNC_BATCH_SIZE: ${SYNC_BATCH_SIZE:-1000}
      SYNC_QUIET_PERIOD_SECONDS: ${SYNC_QUIET_PERIOD_SECONDS:-900}
      REPROCESS_INTERVAL_SECONDS: ${REPROCESS_INTERVAL_SECONDS:-3600}
    depends_on:
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  ui:
    image: ${UI_IMAGE:-platform-ui:local}
    container_name: ${CLIENT_NAME}-ui
    environment:
      CLIENT_NAME: ${CLIENT_NAME} # substituted into the nginx template (/client.json)
    ports:
      - "${UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m

  mongo:
    image: mongo:7
    container_name: ${CLIENT_NAME}-mongo
    # Empty values are treated as unset by the mongo entrypoint: with
    # credentials the server enforces auth, without them it is open — but
    # only inside the project network either way (no host port published;
    # use `docker exec -it <client>-mongo mongosh` for direct inserts).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_DB_USER:-}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_DB_PASSWORD:-}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Authenticates when credentials are configured: a plain ping is
      # auth-exempt and would stay green even in the broken "credentials
      # added AFTER an auth-less first boot" state (entrypoint only creates
      # the root user on an empty volume). ${MONGO_DB_USER:+...} interpolates
      # at compose time; $$MONGO_INITDB_ROOT_* expand inside the container.
      test: ["CMD-SHELL", "mongosh --quiet ${MONGO_DB_USER:+-u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin} --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  langwatch:
    image: langwatch/langwatch:3.5.0
    container_name: ${CLIENT_NAME}-langwatch
    environment:
      <<: *langwatch-env
    ports:
      - "${LANGWATCH_PORT:-5560}:5560"
    depends_on:
      <<: *langwatch-deps
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g

  langwatch-workers:
    image: langwatch/langwatch:3.5.0
    container_name: ${CLIENT_NAME}-langwatch-workers
    command: ["pnpm", "run", "start:workers"]
    working_dir: /app/langwatch
    environment:
      <<: *langwatch-env
    depends_on:
      <<: *langwatch-deps
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1536m # upstream dev compose cap for the workers process

  postgres:
    image: postgres:16
    container_name: ${CLIENT_NAME}-langwatch-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis:7-alpine
    container_name: ${CLIENT_NAME}-langwatch-redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m # upstream raised this from 64m after BGSAVE OOM kills

  clickhouse:
    image: langwatch/clickhouse-serverless:0.2.0
    container_name: ${CLIENT_NAME}-langwatch-clickhouse
    environment:
      CLICKHOUSE_PASSWORD: langwatch
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.0"

volumes:
  mongo-data:
  db-data:
  redis-data:
  clickhouse-data:
