# THE MODULE — the platform's own services: api + ui. (The
# trace-ingestion-worker lives in compose.connector.yml: it scales with
# the connector, not with the module — one ingestor per LangWatch stack.)
#
# One client = one compose PROJECT assembled from role files (decision 65):
#
#   compose.module.yml     (this file — always)
#   compose.connector.yml  (the connector: LangWatch stack + its couplings)
#   compose.mongodb.yml    (the database: mongo + its couplings)
#   compose.dev.yml        (dev overlay: build blocks + demo fixtures)
#
#   docker compose -f compose.module.yml -f compose.connector.yml \
#     -f compose.mongodb.yml --env-file clients/<name>.env up -d
#
# (The Makefile wraps this chain; see clients/example.env for the env
# contract.) All files merge into ONE project — same network, DNS,
# volumes. Couplings live in the file that introduces them: this file
# never names a langwatch or mongo service, so swapping a connector or
# pointing at an external database is a change of FILES + env, not edits
# here. A future connector/store = a new compose.<name>.yml alongside.
#
# This file knows NO client: every client-specific value arrives via the
# env file. ${CLIENT_NAME:?...} makes a missing env file fail loudly
# instead of composing a half-named stack.

# Fallback project name = the client slug. Without this, an env file that
# forgets COMPOSE_PROJECT_NAME would fall back to the DIRECTORY name — and
# two such clients would silently collapse into one project sharing one
# mongo volume. COMPOSE_PROJECT_NAME from the env file still takes
# precedence when set.
name: ${CLIENT_NAME}

services:
  api:
    image: ${API_IMAGE:-platform-api:local}
    container_name: ${CLIENT_NAME:?set CLIENT_NAME via --env-file (see clients/example.env)}-api
    init: true # app has no signal handlers; let PID 1 forward SIGTERM
    environment:
      ENVIRONMENT: production
      SERVER_PORT: "3000"
      CLIENT_NAME: ${CLIENT_NAME} # brands the OpenAPI docs of this instance
      # Host defaults to the in-project mongo (compose.mongodb.yml); an
      # external database = drop that file and set these in the env file.
      MONGO_DB_HOST: ${MONGO_DB_HOST:-mongo}
      MONGO_DB_PORT: ${MONGO_DB_PORT:-27017}
      MONGO_DB_NAME: ${CLIENT_NAME}
      MONGO_DB_USER: ${MONGO_DB_USER:-}
      MONGO_DB_PASSWORD: ${MONGO_DB_PASSWORD:-}
      # Auth System (M2M) — forwarded from the client env, or the API stays
      # open (PoC behavior). The `:-` default interpolates to EMPTY when the
      # env file omits/comments the var; environment-setup.ts treats '' as
      # unset, so an empty forward can never half-enable auth.
      AUTH_SYSTEM_URL: ${AUTH_SYSTEM_URL:-}
      AUTH_SYSTEM_CLIENT_ID: ${AUTH_SYSTEM_CLIENT_ID:-}
      AUTH_SYSTEM_CLIENT_SECRET: ${AUTH_SYSTEM_CLIENT_SECRET:-}
    ports:
      # Loopback by default: the API is auth-less until AUTH_SYSTEM_URL is
      # set, and it serves the full unmasked archive. Exposing beyond
      # localhost is an explicit opt-in — API_BIND=0.0.0.0 + a firewall
      # (see clients/example.env).
      - "${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000"
    healthcheck:
      # openapi.json is built in memory at startup — proves the process is up.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/docs/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  ui:
    image: ${UI_IMAGE:-platform-ui:local}
    container_name: ${CLIENT_NAME}-ui
    environment:
      CLIENT_NAME: ${CLIENT_NAME} # substituted into the nginx template (/client.json)
    ports:
      # Same loopback default as the api. The UI is the client-facing
      # surface, so UI_BIND=0.0.0.0 is the override that may legitimately
      # be needed — still behind a firewall (the UI proxies the auth-less
      # API); see clients/example.env.
      - "${UI_BIND:-127.0.0.1}:${UI_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64m
